<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">The Lifetime Cost Nobody Compares</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">Acquisition is only 3–10% of what a dog costs over 10+ years.</text><text x="28" y="84" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">A $500 adoption that develops $8,000 in health problems costs more than a well-bred $2,500 puppy</text>
<rect x="40" y="98" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="98" width="6" height="40" rx="3" fill="#DC2626"/><text x="60" y="123" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Acquisition (adopt vs breeder)</text><text x="740" y="123" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#DC2626">$50–500 vs $1,100–3,250</text>
<rect x="40" y="146" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="146" width="6" height="40" rx="3" fill="#F6851B"/><text x="60" y="171" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Food &amp; treats (10–13 years)</text><text x="740" y="171" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#F6851B">$6,000–$12,000</text>
<rect x="40" y="194" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="194" width="6" height="40" rx="3" fill="#F6851B"/><text x="60" y="219" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Routine vet care (annual exams, vaccines, dental)</text><text x="740" y="219" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#F6851B">$4,000–$8,000</text>
<rect x="40" y="242" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="242" width="6" height="40" rx="3" fill="#DC2626"/><text x="60" y="267" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Emergency vet (one incident can be)</text><text x="740" y="267" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#DC2626">$1,000–$8,000</text>
<rect x="40" y="290" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="290" width="6" height="40" rx="3" fill="#F6851B"/><text x="60" y="315" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Pet insurance (accident &amp; illness, 10 years)</text><text x="740" y="315" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#F6851B">$3,000–$6,000</text>
<rect x="40" y="338" width="720" height="40" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="338" width="6" height="40" rx="3" fill="#F6851B"/><text x="60" y="363" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Grooming, boarding, toys, supplies</text><text x="740" y="363" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#F6851B">$2,000–$5,000</text>
<rect x="40" y="390" width="720" height="42" rx="10" fill="#F6851B" opacity="0.12"/>
<text x="60" y="417" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#C2410C">LIFETIME TOTAL: roughly $16,000–$36,000 regardless of how you acquire</text>
</svg>