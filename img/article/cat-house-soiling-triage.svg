<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#FAF6EF"/>
  <rect x="0" y="0" width="800" height="58" fill="#F6851B"/>
  <text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Cat Peeing Outside the Box? Work the List in Order</text>
  <text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">The three families of causes look identical from the outside — the order is what solves it</text>

  <!-- Step 1 -->
  <circle cx="44" cy="114" r="16" fill="#DC2626"/>
  <text x="44" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">1</text>
  <rect x="72" y="76" width="700" height="76" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
  <text x="88" y="101" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Emergency check (30 seconds)</text>
  <text x="756" y="101" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#DC2626">EMERGENCY</text>
  <text x="88" y="123" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Male cat + straining, crying, or little to no urine = go now. A complete blockage is fatal if it is not relieved.</text>
  <text x="88" y="139" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">This is not a behaviour problem, and "he seems calmer now" is not a reason to wait for morning.</text>

  <!-- Step 2 -->
  <circle cx="44" cy="202" r="16" fill="#2563EB"/>
  <text x="44" y="209" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">2</text>
  <rect x="72" y="164" width="700" height="76" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
  <text x="88" y="189" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Vet visit — rule out the medical causes</text>
  <text x="756" y="189" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#2563EB">ALWAYS FIRST</text>
  <text x="88" y="211" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Urinalysis, urine culture, bloodwork. Cystitis, stones, kidney disease and diabetes all look like bad habits.</text>
  <text x="88" y="227" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">A painful bladder builds a box aversion that outlives the illness — so treat it before you re-train anything.</text>

  <!-- Step 3 -->
  <circle cx="44" cy="290" r="16" fill="#16A34A"/>
  <text x="44" y="297" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">3</text>
  <rect x="72" y="252" width="700" height="76" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
  <text x="88" y="277" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Litter box audit: count, size, litter, depth, cleanliness, place</text>
  <text x="756" y="277" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#16A34A">MOST CASES</text>
  <text x="88" y="299" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">1 box per cat + 1 · 1.5× body length · unscented fine clumping · ~3 cm deep · scoop daily · lid off</text>
  <text x="88" y="315" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Quiet spot, escape route, away from food. Two boxes in the same room register as one box.</text>

  <!-- Step 4 -->
  <circle cx="44" cy="378" r="16" fill="#F6851B"/>
  <text x="44" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">4</text>
  <rect x="72" y="340" width="700" height="76" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
  <text x="88" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Household audit — what changed in the last 8 weeks?</text>
  <text x="756" y="365" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#F6851B">IF STILL SOILING</text>
  <text x="88" y="387" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">New cat, new baby, a move, renovation, or a neighbourhood cat patrolling the window.</text>
  <text x="88" y="403" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Separate and multiply resources. Give it 8 weeks, not 3 days. Never punish — it feeds hiding.</text>

  <text x="28" y="436" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#8C8C8C">Sources: AAFP/ISFM House-Soiling Guidelines (Carney 2014) · AAFP/ISFM Environmental Needs Guidelines (Ellis 2013) · Grigg 2013 · Guy 2014</text>
</svg>
