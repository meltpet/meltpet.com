<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect x="0" y="0" width="800" height="450" fill="#FAF6EF"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" fill="#F6851B"/>
  <text x="30" y="33" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">How long do cats live?</text>
  <text x="30" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#FDEBD7">One population number, one conditional number, and the share that reach old age</text>

  <!-- ── Card 1: AT BIRTH ── -->
  <rect x="28" y="90" width="232" height="292" rx="12" fill="#FFFFFF" stroke="#EADFD0" stroke-width="1.4"/>
  <circle cx="52" cy="118" r="13" fill="#F6851B"/>
  <text x="52" y="123" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="72" y="123" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8A5A1E" letter-spacing="0.6">AT BIRTH</text>

  <text x="46" y="172" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#2F2A24">11.74</text>
  <text x="46" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">years, life expectancy</text>
  <text x="46" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">at age 0</text>

  <line x1="46" y1="230" x2="242" y2="230" stroke="#EFE3D3" stroke-width="1.2"/>

  <text x="46" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B5348">UK companion cats, 2019</text>
  <text x="46" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B5348">7,936 recorded deaths</text>
  <text x="46" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#2F2A24">95% CI 11.61-11.87</text>
  <text x="46" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">This is the number every</text>
  <text x="46" y="339" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">site quotes without the CI</text>

  <!-- ── Card 2: AT AGE 10 ── -->
  <rect x="284" y="90" width="232" height="292" rx="12" fill="#FFFFFF" stroke="#EADFD0" stroke-width="1.4"/>
  <circle cx="308" cy="118" r="13" fill="#F6851B"/>
  <text x="308" y="123" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="328" y="123" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8A5A1E" letter-spacing="0.6">AT AGE 10</text>

  <text x="302" y="172" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#2F2A24">5.46</text>
  <text x="302" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">more years on average,</text>
  <text x="302" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">having already reached 10</text>

  <line x1="302" y1="230" x2="498" y2="230" stroke="#EFE3D3" stroke-width="1.2"/>

  <text x="302" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B5348">so the expected total is</text>
  <text x="302" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F7D4F">10 + 5.46 = 15.5</text>
  <text x="302" y="298" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5B5348">not 11.74</text>
  <text x="302" y="325" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">Survivors are not average</text>
  <text x="302" y="342" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">cats. The table is per age.</text>

  <!-- ── Card 3: REACHING 15 ── -->
  <rect x="540" y="90" width="232" height="292" rx="12" fill="#FFFFFF" stroke="#EADFD0" stroke-width="1.4"/>
  <circle cx="564" cy="118" r="13" fill="#F6851B"/>
  <text x="564" y="123" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="584" y="123" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#8A5A1E" letter-spacing="0.6">REACHING 15</text>

  <text x="558" y="172" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#2F2A24">35%</text>
  <text x="558" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">of the same cohort is</text>
  <text x="558" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5B5348">still alive at 15</text>

  <line x1="558" y1="230" x2="754" y2="230" stroke="#EFE3D3" stroke-width="1.2"/>

  <text x="558" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#2F2A24">65% reach 10</text>
  <text x="558" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#2F2A24">14% reach 18</text>
  <text x="558" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#2F2A24">4% reach 20</text>
  <text x="558" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">Derived from the l(x)</text>
  <text x="558" y="339" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#8C8175">column of the same table</text>

  <!-- Sources strip -->
  <line x1="28" y1="404" x2="772" y2="404" stroke="#EADFD0" stroke-width="1.2"/>
  <text x="28" y="426" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8C8175">Sources: Teng, Brodbelt, Church &amp; O'Neill 2024, Journal of Feline Medicine and Surgery 26(5) - VetCompass life tables, UK, n = 7,936 -</text>
  <text x="28" y="441" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8C8175">the reaching-15 shares are arithmetic on that paper's published l(x) column, not a separate finding</text>
</svg>
