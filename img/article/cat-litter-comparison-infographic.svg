<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Cat Litter Comparison (2026)</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">70% of the market is clumping clay — but "best" depends on your cat, your budget and your nose</text><text x="28" y="72" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">One cat hated the $38 litter and loved the $9 one — texture beats marketing</text><text x="40" y="78" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">TYPE</text><text x="230" y="78" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">VALUE</text><text x="390" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">PRICE</text><text x="520" y="78" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">REALITY CHECK</text><line x1="40" y1="96" x2="760" y2="96" stroke="#E5E1D8"/><circle cx="48" cy="108" r="5" fill="#F6851B"/><text x="62" y="112" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Clumping clay</text><text x="230" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">~70% market share</text><text x="390" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">$14–19 / fill</text><text x="520" y="112" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">Hard clumps, best odor control, cat-standard</text><circle cx="48" cy="144" r="5" fill="#16A34A"/><text x="62" y="148" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Pine pellets</text><text x="230" y="148" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Budget pick</text><text x="390" y="148" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">$6–10 / fill</text><text x="520" y="148" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">Cheap, natural, low tracking — change once a month</text><circle cx="48" cy="180" r="5" fill="#2563EB"/><text x="62" y="184" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Crystal / silica</text><text x="230" y="184" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Low maintenance</text><text x="390" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">$15–25 / fill</text><text x="520" y="184" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">Lasts longest, almost no dust — pricier upfront</text><circle cx="48" cy="216" r="5" fill="#D96F0E"/><text x="62" y="220" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Walnut shell</text><text x="230" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Biodegradable</text><text x="390" y="220" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">$18–22 / fill</text><text x="520" y="220" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">Natural, clumps well — softer under paw</text><circle cx="48" cy="252" r="5" fill="#6B6B6B"/><text x="62" y="256" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Paper (non-clumping)</text><text x="230" y="256" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Kitten / post-surgery</text><text x="390" y="256" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">$12–18 / fill</text><text x="520" y="256" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">Safest if eaten — must change often</text><rect x="28" y="302" width="744" height="44" rx="8" fill="#FDE8D2"/><text x="48" y="329" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#D96F0E">Cats hate scented litter and coarse textures — scent-free unscented beats "7-day odor control" every time</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet litter testing + 2018 J Vet Behavior acceptance study · Prices are typical per-fill costs</text></svg>