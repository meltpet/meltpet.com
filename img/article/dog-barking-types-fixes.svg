<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4 Types of Barking — and the Fix That Fits</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">Match the fix to the type. Barking is a symptom; the cause is different in each case.</text>
<rect x="36" y="84" width="352" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<rect x="36" y="84" width="352" height="40" rx="12" fill="#2563EB"/><rect x="36" y="102" width="352" height="22" fill="#2563EB"/>
<text x="212" y="109" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">TYPE 1: THE WINDOW SENTINEL</text>
<text x="56" y="144" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">What it is:</tspan> barks at every passerby, squirrel, leaf</text>
<text x="56" y="164" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">Why:</tspan> territory — the view IS the trigger</text>
<text x="56" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F5E9E">Fix: block the view — blinds, frosted film,</text>
<text x="56" y="209" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F5E9E">move the dog bed away from the window,</text>
<text x="56" y="228" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F5E9E">treat before the bark (not after)</text>
<rect x="412" y="84" width="352" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<rect x="412" y="84" width="352" height="40" rx="12" fill="#F6851B"/><rect x="412" y="102" width="352" height="22" fill="#F6851B"/>
<text x="588" y="109" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">TYPE 2: THE BORED BRAWLER</text>
<text x="432" y="144" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">What it is:</tspan> barks at nothing, often while pacing</text>
<text x="432" y="164" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">Why:</tspan> pent-up energy with no outlet</text>
<text x="432" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#C2410C">Fix: real exercise first (sniff walks count),</text>
<text x="432" y="209" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#C2410C">then enrichment — puzzle toys, snuffle</text>
<text x="432" y="228" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#C2410C">mats, training games, chews</text>
<rect x="36" y="250" width="352" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<rect x="36" y="250" width="352" height="40" rx="12" fill="#7C3AED"/><rect x="36" y="268" width="352" height="22" fill="#7C3AED"/>
<text x="212" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">TYPE 3: THE FEAR BARKER</text>
<text x="56" y="310" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">What it is:</tspan> barks at specific triggers (men, dogs, noise)</text>
<text x="56" y="330" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">Why:</tspan> distance-increasing — "stay away!"</text>
<text x="56" y="356" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#5B21B6">Fix: remove the trigger when possible, keep</text>
<text x="56" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5B21B6">distance, reward calm at threshold, build</text>
<text x="56" y="394" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5B21B6">confidence with desensitization</text>
<rect x="412" y="250" width="352" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<rect x="412" y="250" width="352" height="40" rx="12" fill="#DC2626"/><rect x="412" y="268" width="352" height="22" fill="#DC2626"/>
<text x="588" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF">TYPE 4: THE DEMAND BARKER</text>
<text x="432" y="310" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">What it is:</tspan> barks AT you for treats, food, attention</text>
<text x="432" y="330" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F"><tspan font-weight="700">Why:</tspan> it worked before — barking = reward</text>
<text x="432" y="356" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#991B1B">Fix: ignore completely, reward only quiet,</text>
<text x="432" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#991B1B">preempt the trigger ("quiet" + treat before</text>
<text x="432" y="394" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#991B1B">the demand starts)</text>
<text x="400" y="428" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">Never use shock collars or screaming — they cause fear and make barking worse.</text>
</svg>