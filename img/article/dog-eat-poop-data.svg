<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Why Do Dogs Eat Poop? The Data</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">The 2018 UC Davis survey of 1,500+ dogs — it is usually not a deficiency</text><rect x="28" y="84" width="240" height="330" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="148" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800" fill="#16A34A">16%</text><text x="148" y="164" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">of dogs are "serious"</text><text x="148" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">stool eaters</text><text x="148" y="208" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">(caught 6+ times)</text><line x1="60" y1="236" x2="236" y2="236" stroke="#E5E1D8"/><text x="148" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F6851B">23%</text><text x="148" y="294" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">observed eating</text><text x="148" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">stool at least once</text><text x="148" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#2563EB">85%</text><text x="148" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">preferred FRESH poop</text><text x="148" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">(under 2 days old)</text><rect x="292" y="84" width="480" height="330" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="316" y="112" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#D96F0E">What the study ruled OUT</text><text x="316" y="138" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">✕ Diet quality</text><text x="330" y="154" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Poop-eaters were not on worse or cheaper food</text><text x="316" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">✕ Age, sex &amp; neuter status</text><text x="330" y="206" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">No demographic pattern at all</text><text x="316" y="242" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">✕ House-training</text><text x="330" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Well-trained dogs did it just as often</text><line x1="316" y1="284" x2="748" y2="284" stroke="#E5E1D8"/><text x="316" y="310" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#16A34A">What it points TO</text><text x="316" y="336" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ "Greedy eaters"</text><text x="330" y="352" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Food-motivated dogs were far more likely to do it</text><text x="316" y="388" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ Ancestral den hygiene</text><text x="330" y="404" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Mother dogs and wolves eat puppy poop to keep the den clean</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: Hart et al., "The paradox of canine conspecific coprophagy," Veterinary Medicine and Science (2018)</text></svg>
