<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Dry vs Wet vs Raw Dog Food</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">What you actually pay for a 50 lb dog — and what each format really changes</text><rect x="28" y="78" width="238" height="280" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="78" width="238" height="44" rx="10" fill="#F6851B"/><text x="147" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">DRY KIBBLE</text><text x="147" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#FFF3E6">50 lb dog · per month</text><text x="147" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#F6851B">$25–50/mo</text><text x="147" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#1F1F1F">Moisture ~10%</text><text x="44" y="206" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16A34A">+ Cheap, convenient</text><text x="44" y="232" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#DC2626">– Highly processed</text><text x="44" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Low-protein economy brands</text><text x="44" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1F1F1F">The label trap:</text><text x="44" y="312" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">"natural" and "premium" are</text><text x="44" y="328" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">marketing, not nutrition.</text><rect x="280" y="78" width="238" height="280" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="280" y="78" width="238" height="44" rx="10" fill="#D96F0E"/><text x="399" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">WET / CANNED</text><text x="399" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#FFF3E6">50 lb dog · per month</text><text x="399" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#D96F0E">$150–350/mo</text><text x="399" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#1F1F1F">Moisture 75–85%</text><text x="296" y="206" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16A34A">+ Hydration, high protein</text><text x="296" y="232" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#DC2626">– Expensive, spoils fast</text><text x="296" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Storage + cleanup</text><text x="296" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1F1F1F">The label trap:</text><text x="296" y="312" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">"natural" and "premium" are</text><text x="296" y="328" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">marketing, not nutrition.</text><rect x="532" y="78" width="238" height="280" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="532" y="78" width="238" height="44" rx="10" fill="#16A34A"/><text x="651" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">RAW / FRESH</text><text x="651" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#FFF3E6">50 lb dog · per month</text><text x="651" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#16A34A">$100–200/mo</text><text x="651" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#1F1F1F">Fresh, whole foods</text><text x="548" y="206" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#16A34A">+ Full ingredient control</text><text x="548" y="232" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#DC2626">– Bacterial risk</text><text x="548" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Time + balance risk</text><text x="548" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1F1F1F">The label trap:</text><text x="548" y="312" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">"natural" and "premium" are</text><text x="548" y="328" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">marketing, not nutrition.</text><rect x="28" y="374" width="744" height="42" rx="8" fill="#FDE8D2"/><text x="400" y="393" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#D96F0E">$50 vs $80/month is a $360/year difference — pick on evidence, not packaging</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet label-industry insider analysis · Feeding-trial brands vs marketing-only claims</text></svg>