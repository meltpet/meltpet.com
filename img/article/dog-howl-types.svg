<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Why Do Dogs Howl? It’s Not a Wolf Call</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">Most dog sounds are aimed at humans — howling is one of the few aimed at distance</text><rect x="28" y="84" width="744" height="48" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="84" width="8" height="48" rx="4" fill="#F6851B"/><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">Separation howl</text><text x="56" y="124" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">The "I’m here, where are you?" — often at 5 pm when you’re late</text><rect x="640" y="98" width="110" height="20" rx="10" fill="#F6851B"/><text x="695.0" y="112" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">NOT DISTRESS</text><rect x="28" y="140" width="744" height="48" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="140" width="8" height="48" rx="4" fill="#2563EB"/><text x="56" y="161" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">Siren / music howl</text><text x="56" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">High pitch triggers it; it’s your dog joining the pack chorus</text><rect x="640" y="154" width="110" height="20" rx="10" fill="#2563EB"/><text x="695.0" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">NOT DISTRESS</text><rect x="28" y="196" width="744" height="48" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="196" width="8" height="48" rx="4" fill="#16A34A"/><text x="56" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">Attention howl</text><text x="56" y="236" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">A learned behavior — it worked once, so it now works always</text><rect x="640" y="210" width="110" height="20" rx="10" fill="#16A34A"/><text x="695.0" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">NOT DISTRESS</text><rect x="28" y="252" width="744" height="48" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="252" width="8" height="48" rx="4" fill="#D96F0E"/><text x="56" y="273" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">Hunting howl</text><text x="56" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Scent hounds reporting position to the rest of the pack</text><rect x="640" y="266" width="110" height="20" rx="10" fill="#D96F0E"/><text x="695.0" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">NOT DISTRESS</text><rect x="28" y="308" width="744" height="48" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="308" width="8" height="48" rx="4" fill="#DC2626"/><text x="56" y="329" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">Injury / distress</text><text x="56" y="348" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">The rare one to worry about — paired with pacing or hiding</text><rect x="640" y="322" width="110" height="20" rx="10" fill="#DC2626"/><text x="695.0" y="336" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">NOT DISTRESS</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet behavior analysis · Context matters: howling alone is normal; howling + destruction is separation anxiety</text></svg>