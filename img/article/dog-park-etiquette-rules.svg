<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Dog Park Etiquette: The Rules Nobody Posts</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">When it works, it's magic. When it doesn't, someone visits the emergency vet.</text>
<rect x="40" y="78" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="97" r="11" fill="#F6851B"/><text x="64" y="101" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">1</text><text x="86" y="102" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Keep the leash on for the first 30 seconds — let your dog scan the park before release</text>
<rect x="40" y="122" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="141" r="11" fill="#F6851B"/><text x="64" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">2</text><text x="86" y="146" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">No treats — high-value food in a pen of 20 dogs is a resource-guarding incident waiting to happen</text>
<rect x="40" y="166" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="185" r="11" fill="#F6851B"/><text x="64" y="189" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">3</text><text x="86" y="190" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">No toys — any ball you bring now belongs to the park (guarders fight, swallowers choke)</text>
<rect x="40" y="210" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="229" r="11" fill="#F6851B"/><text x="64" y="233" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">4</text><text x="86" y="234" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Don't cluster with other owners — spread out so the dogs keep flowing, not cornered</text>
<rect x="40" y="254" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="273" r="11" fill="#F6851B"/><text x="64" y="277" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">5</text><text x="86" y="278" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Your dog doesn't have to greet every dog — recall her if the other dog is fleeing</text>
<rect x="40" y="298" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><circle cx="64" cy="317" r="11" fill="#F6851B"/><text x="64" y="321" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">6</text><text x="86" y="322" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1F1F1F">Pick up your dog's poop. This shouldn't need saying. It always does.</text>
<rect x="40" y="352" width="720" height="58" rx="10" fill="#DC2626" opacity="0.1" stroke="#DC2626" stroke-width="1"/>
<text x="60" y="374" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#991B1B">Never bring: unvaccinated puppies under 16 weeks · dogs in heat · dogs with no verbal recall</text>
<text x="60" y="396" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#991B1B">Parvo lives in soil. In-heat pheromones start fights between neutered males. No recall = no control.</text>
</svg>