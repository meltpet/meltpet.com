<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Why Do Dogs Eat Grass? The Data</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">Spoiler: it’s probably not because they’re sick — the numbers say otherwise</text><rect x="28" y="84" width="240" height="330" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="148" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#16A34A">92%</text><text x="148" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">of grass-eating dogs</text><text x="148" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">showed NO sign of</text><text x="148" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1F1F1F">illness beforehand</text><line x1="60" y1="240" x2="236" y2="240" stroke="#E5E1D8"/><text x="148" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#F6851B">8%</text><text x="148" y="294" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">showed any sign of</text><text x="148" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">illness before eating</text><text x="148" y="346" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#2563EB">22%</text><text x="148" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">actually vomited</text><text x="148" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">after eating grass</text><rect x="292" y="84" width="480" height="330" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="316" y="114" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="800" fill="#D96F0E">So why do they do it?</text><text x="316" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ Taste &amp; texture</text><text x="330" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Fresh grass is crunchy, sweet and novel — a snack, not a symptom</text><text x="316" y="192" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ Digestive aid</text><text x="330" y="208" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Adds fiber; helps pass hairballs or small swallowed objects</text><text x="316" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ Boredom / attention</text><text x="330" y="260" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Grass-eating often spikes in yards with nothing else to do</text><text x="316" y="296" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#1F1F1F">▸ Instinct</text><text x="330" y="312" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Wild canids eat plant matter; grass may be a leftover behavior</text><text x="316" y="354" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#DC2626">⚠ Only worry if: vomiting is frequent, or grass is treated</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: Veterinary survey data on grass-eating behavior · Rates from peer-reviewed studies cited in the article</text></svg>