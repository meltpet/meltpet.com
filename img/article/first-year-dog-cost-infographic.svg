<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">First Year of Dog Ownership: $5,237</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">365 days of real receipts — not the $1,500 most articles quote</text><text x="28" y="84" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">One medium mixed-breed dog · mid-sized U.S. city · every line item tracked, 2024–2025</text>
<rect x="40" y="96" width="330" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<text x="58" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">What most articles quote:</text>
<text x="58" y="134" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#6B6B6B">$1,200–$1,500 / year</text>
<circle cx="400" cy="119" r="24" fill="#DC2626"/><text x="400" y="124" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3.5×</text>
<rect x="430" y="96" width="330" height="46" rx="10" fill="#F6851B"/>
<text x="448" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#FFF3E6">The real first-year total:</text>
<text x="448" y="134" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">$5,237 / year</text>
<text x="400" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Where the $5,237 went</text>
<rect x="40" y="172" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="172" width="6" height="38" rx="3" fill="#DC2626"/><text x="60" y="196" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Emergency vet — ate a sock, Saturday-night surgery</text><text x="742" y="196" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#DC2626">$1,240</text>
<rect x="40" y="216" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="216" width="6" height="38" rx="3" fill="#2563EB"/><text x="60" y="240" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Walker + boarding + destroyed toys</text><text x="742" y="240" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#2563EB">$880</text>
<rect x="40" y="260" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="260" width="6" height="38" rx="3" fill="#2563EB"/><text x="60" y="284" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Routine vet + pet insurance ($35/mo)</text><text x="742" y="284" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#2563EB">$840</text>
<rect x="40" y="304" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="304" width="6" height="38" rx="3" fill="#16A34A"/><text x="60" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Adoption fee + 6-week training class</text><text x="742" y="328" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#16A34A">$700</text>
<rect x="40" y="348" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="348" width="6" height="38" rx="3" fill="#F6851B"/><text x="60" y="372" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Food — mid-range kibble, 55 lbs</text><text x="742" y="372" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$620</text>
<rect x="40" y="392" width="720" height="38" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="40" y="392" width="6" height="38" rx="3" fill="#F6851B"/><text x="60" y="416" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1F1F1F">Initial supplies — crate, bed, bowls, leash</text><text x="742" y="416" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$480</text>
<text x="400" y="444" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Remaining: treats, beds, boarding weekend, misc — the biggest lesson: insurance before the first vet visit</text>
</svg>