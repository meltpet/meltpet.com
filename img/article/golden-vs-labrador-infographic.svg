<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Golden Retriever vs Labrador Retriever</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">Same price tag, very different health lottery — the 12-year math on both</text><rect x="28" y="76" width="362" height="240" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="48" y="102" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#D96F0E">Golden Retriever</text><rect x="48" y="112" width="96" height="20" rx="10" fill="#F6851B"/><text x="96.0" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">COST: $185–325/mo</text><rect x="48" y="140" width="96" height="20" rx="10" fill="#F6851B"/><text x="96.0" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">YEARLY: $2,220–3,900</text><text x="48" y="184" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#DC2626">60% develop cancer</text><text x="48" y="204" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">hemangiosarcoma, lymphoma, osteosarcoma</text><text x="48" y="230" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">20% hip dysplasia</text><text x="48" y="256" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">Grooming every 6–8 weeks</text><text x="48" y="282" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Foreign-body surgery: $1,500–$5,000</text><text x="48" y="306" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Leads the league in sock-eating</text><rect x="410" y="76" width="362" height="240" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="430" y="102" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#2563EB">Labrador Retriever</text><rect x="430" y="112" width="96" height="20" rx="10" fill="#2563EB"/><text x="478.0" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">COST: $185–325/mo</text><rect x="430" y="140" width="96" height="20" rx="10" fill="#2563EB"/><text x="478.0" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">YEARLY: $2,220–3,900</text><text x="430" y="184" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#DC2626">40–60% tear a CCL</text><text x="430" y="204" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">...and half blow the other knee within 2 years</text><text x="430" y="230" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">Surgery: $2,500–$5,000 per knee</text><text x="430" y="256" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F1F1F">Lower grooming cost</text><text x="430" y="282" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Also eats socks (less famous for it)</text><text x="430" y="306" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">America’s most returned breed</text><rect x="28" y="332" width="744" height="82" rx="10" fill="#FDE8D2"/><text x="48" y="358" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#D96F0E">12-year total: $27,000–$47,000 for either breed</text><text x="48" y="382" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Plan for $3,000–$8,000 in major vet costs regardless of which you pick.</text><text x="48" y="404" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">The real difference is which health lottery you’re buying a ticket for.</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet breed comparison · Cancer rates, CCL statistics and vet-cost ranges cross-checked against veterinary literature</text></svg>