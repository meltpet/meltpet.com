<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">The Hidden Costs Nobody Shows You</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">Food and routine vet are the visible 30% — here is where the rest of the money goes</text><text x="28" y="72" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">The spreadsheet I wish someone had shown me: my budget said $2,840/year — real life said far more</text><rect x="28" y="78" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="78" width="6" height="34" rx="3" fill="#DC2626"/><text x="48" y="99" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Emergency vet (sock, injury, allergy)</text><text x="612" y="99" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#DC2626">$150–$400 per incident</text><rect x="28" y="120" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="120" width="6" height="34" rx="3" fill="#F6851B"/><text x="48" y="141" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Special diets after an allergy diagnosis</text><text x="612" y="141" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$65+ per bag</text><rect x="28" y="162" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="162" width="6" height="34" rx="3" fill="#F6851B"/><text x="48" y="183" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Boarding / walker when you travel</text><text x="612" y="183" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$25–55 per night</text><rect x="28" y="204" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="204" width="6" height="34" rx="3" fill="#DC2626"/><text x="48" y="225" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Landlord deposits + damage</text><text x="612" y="225" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#DC2626">$400–$1,200 in year one</text><rect x="28" y="246" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="246" width="6" height="34" rx="3" fill="#F6851B"/><text x="48" y="267" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Behavioral training / classes</text><text x="612" y="267" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$150–$300 per course</text><rect x="28" y="288" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="288" width="6" height="34" rx="3" fill="#D96F0E"/><text x="48" y="309" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Dental cleanings (most owners skip)</text><text x="612" y="309" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#D96F0E">$300–$800 each</text><rect x="28" y="330" width="600" height="34" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="330" width="6" height="34" rx="3" fill="#F6851B"/><text x="48" y="351" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Destroyed items (shoes, rugs, drywall)</text><text x="612" y="351" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#F6851B">$50–$500 per incident</text><rect x="648" y="80" width="130" height="20" rx="10" fill="#F6851B"/><text x="713.0" y="94" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">BUDGET vs REALITY</text><text x="648" y="120" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Planned</text><text x="775" y="118" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#1F1F1F">$2,840</text><text x="648" y="146" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Reality</text><text x="775" y="144" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#DC2626">$5,237</text><text x="648" y="172" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">+84% over budget</text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet first-year cost tracking · Most emergency trips are under $1,000, but the big ones exceed $2,000</text></svg>