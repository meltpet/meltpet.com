<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Indestructible Dog Toys: The Math</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">A $20 toy that lasts a week costs $1,040 a year — durability is the real budget item</text><text x="28" y="74" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">My Lab destroyed a "tough" toy in 8 minutes — real lifespans from owner reports</text><text x="40" y="86" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">TOY</text><text x="300" y="86" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">BEST FOR</text><text x="480" y="86" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">PRICE</text><text x="650" y="86" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#6B6B6B">LIFESPAN</text><line x1="40" y1="104" x2="760" y2="104" stroke="#E5E1D8"/><circle cx="48" cy="118" r="5" fill="#F6851B"/><text x="62" y="122" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">KONG Extreme (black)</text><text x="300" y="122" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Aggressive chewers</text><text x="480" y="122" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">$12–20</text><text x="650" y="122" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#F6851B">6–12 months</text><circle cx="48" cy="152" r="5" fill="#D96F0E"/><text x="62" y="156" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Goughnuts Ring (green/black)</text><text x="300" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Power chewers</text><text x="480" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">$25–35</text><text x="650" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#D96F0E">6–8 months</text><circle cx="48" cy="186" r="5" fill="#2563EB"/><text x="62" y="190" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">West Paw Zogoflex</text><text x="300" y="190" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Moderate–heavy chewers</text><text x="480" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">$20–30</text><text x="650" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#2563EB">4–8 months</text><circle cx="48" cy="220" r="5" fill="#F6851B"/><text x="62" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Benebone Wishbone</text><text x="300" y="224" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Flavored nylon, chewers</text><text x="480" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">$8–15</text><text x="650" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#F6851B">2–3 weeks</text><circle cx="48" cy="254" r="5" fill="#16A34A"/><text x="62" y="258" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Nylabone Power Chew</text><text x="300" y="258" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Extreme chewers</text><text x="480" y="258" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">$12–16</text><text x="650" y="258" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#16A34A">4–6 weeks</text><rect x="28" y="300" width="744" height="92" rx="10" fill="#FDE8D2"/><text x="48" y="324" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="800" fill="#D96F0E">Cost-per-week math (aggressive chewer):</text><text x="48" y="348" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">Cheap toy destroyed weekly: $20 × 52 = <tspan font-weight="800" fill="#DC2626">$1,040/year</tspan></text><text x="48" y="370" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1F1F1F">KONG Extreme lasting 9 months: $20 × ~1.3 = <tspan font-weight="800" fill="#16A34A">~$27/year</tspan></text><rect x="0" y="428" width="800" height="22" fill="#FAF6EF"/><text x="28" y="444" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Source: MeltPet toy testing + owner-reported lifespans · Safety first: match hardness to your dog</text></svg>