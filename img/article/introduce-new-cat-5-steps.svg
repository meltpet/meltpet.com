<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Introduce a New Cat: The Scent-First Method</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">Days, not hours. Never skip a step — this is what prevents hissing, hiding, and vet bills.</text>
<rect x="28" y="92" width="140" height="210" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="98" cy="120" r="18" fill="#F6851B"/><text x="98" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">1</text>
<text x="98" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Days 1–2</text>
<text x="98" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#C2410C">Safe Room Only</text>
<text x="98" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Zero contact. New cat</text>
<text x="98" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">decompresses; resident</text>
<text x="98" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">cat processes the smell</text>
<text x="98" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#16A34A">Visit, sit low, treats —</text>
<text x="98" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#16A34A">let the cat come to you</text>
<path d="M168 197 L196 197 M196 197 L189 190 M196 197 L189 204" stroke="#F6851B" stroke-width="2.5" fill="none"/>
<rect x="200" y="92" width="140" height="210" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="270" cy="120" r="18" fill="#F6851B"/><text x="270" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2</text>
<text x="270" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Days 3–4</text>
<text x="270" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#C2410C">Swap Scents</text>
<text x="270" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Swap bedding &amp; toys</text>
<text x="270" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">between rooms daily.</text>
<text x="270" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Rub a cloth on each</text>
<text x="270" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">and leave it out</text>
<text x="270" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#16A34A">Smell = familiar wins</text>
<path d="M340 197 L368 197 M368 197 L361 190 M368 197 L361 204" stroke="#F6851B" stroke-width="2.5" fill="none"/>
<rect x="372" y="92" width="140" height="210" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="442" cy="120" r="18" fill="#F6851B"/><text x="442" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
<text x="442" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Days 5–7</text>
<text x="442" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#C2410C">Feed at the Door</text>
<text x="442" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Feed both cats beside</text>
<text x="442" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">the closed door, at the</text>
<text x="442" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">same time. Association:</text>
<text x="442" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">other cat = food time</text>
<text x="442" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#16A34A">A Feliway diffuser helps</text>
<path d="M512 197 L540 197 M540 197 L533 190 M540 197 L533 204" stroke="#F6851B" stroke-width="2.5" fill="none"/>
<rect x="544" y="92" width="140" height="210" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="614" cy="120" r="18" fill="#F6851B"/><text x="614" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">4</text>
<text x="614" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#1F1F1F">Days 8–10</text>
<text x="614" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#C2410C">Short Meetings</text>
<text x="614" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">5–15 min, supervised,</text>
<text x="614" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">then back to separate</text>
<text x="614" y="228" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">rooms. No hissing?</text>
<text x="614" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">Extend next time</text>
<text x="614" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#16A34A">Hissing = step back</text>
<path d="M684 197 L712 197 M712 197 L705 190 M712 197 L705 204" stroke="#F6851B" stroke-width="2.5" fill="none"/>
<rect x="716" y="92" width="60" height="210" rx="12" fill="#FAF6EF"/>
<circle cx="746" cy="120" r="18" fill="#16A34A"/><text x="746" y="126" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">5</text>
<text x="746" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#1F1F1F">Weeks</text>
<text x="746" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#1F1F1F">2+</text>
<text x="746" y="210" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">Let them</text>
<text x="746" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">set the</text>
<text x="746" y="238" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">pace —</text>
<text x="746" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">some</text>
<text x="746" y="266" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B6B6B">take weeks</text>
<rect x="28" y="330" width="748" height="76" rx="12" fill="#F6851B" opacity="0.1" stroke="#F6851B" stroke-width="1"/>
<text x="402" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#C2410C">The golden rule: never force face-to-face before the scent says "familiar."</text>
<text x="402" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Rushing steps 1–3 is how you get a cat wedged behind the fridge and a resentful resident.</text>
<text x="402" y="402" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Watch for relaxed body language: slow blinks, loose tails, grooming near each other.</text>
</svg>