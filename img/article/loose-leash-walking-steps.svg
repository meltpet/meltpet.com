<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Loose-Leash Walking: Methods That Work</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">No prong collars. No "be the alpha." Just positive reinforcement and consistency.</text>
<rect x="36" y="86" width="352" height="230" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="66" cy="112" r="16" fill="#2563EB"/><text x="66" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">1</text>
<text x="94" y="112" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#1F1F1F">The Tree</text>
<text x="94" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">for pullers who just want to go forward</text>
<text x="56" y="162" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">Tension on the leash = stop moving.</text>
<text x="56" y="182" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">No yank, no "no," no eye contact. Just</text>
<text x="56" y="202" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">become a tree. The instant the leash</text>
<text x="56" y="222" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">goes slack: mark ("yes" or click), treat,</text>
<text x="56" y="242" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">keep walking.</text>
<text x="56" y="272" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#1F5E9E">Works on ~70% of pullers.</text>
<text x="56" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Day 1: 10 minutes to the driveway.</text>
<text x="56" y="308" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Day 7: mostly slack leash. Consistency</text>
<text x="56" y="324" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">is everything — pulling must never pay.</text>
<rect x="412" y="86" width="352" height="230" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="442" cy="112" r="16" fill="#16A34A"/><text x="442" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">2</text>
<text x="470" y="112" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#1F1F1F">The U-Turn</text>
<text x="470" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">for dogs over threshold before leaving the house</text>
<text x="432" y="162" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">The moment the dog hits the end of the</text>
<text x="432" y="182" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">leash, say "this way" cheerfully and turn</text>
<text x="432" y="202" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">180°. Pulling now redirects the whole</text>
<text x="432" y="222" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">walk. Reward every check-in with you.</text>
<text x="432" y="272" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#166534">Better for high-energy &amp; reactive dogs.</text>
<text x="432" y="292" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">You'll pace one 20-ft sidewalk for the</text>
<text x="432" y="308" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">first few sessions. The dog learns:</text>
<text x="432" y="324" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">attention on you = direction.</text>
<rect x="36" y="332" width="728" height="100" rx="12" fill="#F6851B" opacity="0.1" stroke="#F6851B" stroke-width="1"/>
<text x="56" y="356" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#C2410C">The gear that helps: standard 6-ft leash + front-clip harness ($30–$45)</text>
<text x="56" y="379" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Front-clip turns a puller sideways instead of letting them lean into it.</text>
<text x="56" y="399" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Skip: retractables (constant tension) and back-clip harnesses (maximum leverage).</text>
<text x="56" y="419" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Head halters (Gentle Leader) work too — budget a week of desensitization with treats first.</text>
</svg>