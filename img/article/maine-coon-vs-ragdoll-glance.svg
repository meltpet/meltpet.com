<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Maine Coon vs Ragdoll: At a Glance</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">Same size class — completely different roommates.</text>
<rect x="36" y="82" width="352" height="40" rx="10" fill="#F6851B"/>
<text x="212" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">MAINE COON</text>
<rect x="412" y="82" width="352" height="40" rx="10" fill="#7C3AED"/>
<text x="588" y="108" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">RAGDOLL</text>
<rect x="36" y="132" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="56" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Size (male)</text><text x="368" y="152" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">15–25 lbs</text><text x="368" y="170" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">grows until 4 years old</text>
<rect x="412" y="132" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="432" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Size (male)</text><text x="744" y="152" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">12–20 lbs</text><text x="744" y="170" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">big, but not lynx-big</text>
<rect x="36" y="186" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="56" y="206" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Coat</text><text x="368" y="206" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Heavy double coat</text><text x="368" y="224" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">sheds a lot — blows coat 2×/yr</text>
<rect x="412" y="186" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="432" y="206" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Coat</text><text x="744" y="206" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Silky, low-shed</text><text x="744" y="224" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">no dense undercoat — weekly comb</text>
<rect x="36" y="240" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="56" y="260" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Personality</text><text x="368" y="260" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Dog-like, loyal, chirpy</text><text x="368" y="278" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">independent streak, supervises you</text>
<rect x="412" y="240" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="432" y="260" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Personality</text><text x="744" y="260" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Goes limp when held</text><text x="744" y="278" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">clingy — follows you room to room</text>
<rect x="36" y="294" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="56" y="314" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Main health risks</text><text x="368" y="314" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">HCM, hip dysplasia, SMA</text><text x="368" y="332" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">screen breeder lines</text>
<rect x="412" y="294" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="432" y="314" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Main health risks</text><text x="744" y="314" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">HCM, bladder stones</text><text x="744" y="332" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">keep water flowing</text>
<rect x="36" y="348" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="56" y="368" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Apartments</text><text x="368" y="368" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Yes, if you can vacuum</text><text x="368" y="386" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">needs space to patrol</text>
<rect x="412" y="348" width="352" height="46" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><text x="432" y="368" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6B6B6B">Apartments</text><text x="744" y="368" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1F1F1F">Yes — but hates being alone</text><text x="744" y="386" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#6B6B6B">needs company</text>
<rect x="36" y="402" width="352" height="36" rx="10" fill="#F6851B" opacity="0.14"/>
<text x="212" y="426" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#C2410C">Purchase price: $1,500–$3,000</text>
<rect x="412" y="402" width="352" height="36" rx="10" fill="#7C3AED" opacity="0.14"/>
<text x="588" y="426" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#6D28D9">Purchase price: $1,200–$2,500</text>
</svg>