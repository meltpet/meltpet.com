<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="1600" height="900"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="64" fill="#F6851B"/><text x="28" y="28" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">New Puppy Checklist: The Non-Negotiables</text><text x="28" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#FFF3E6">What you actually use — not what the pet store wants you to buy.</text>
<rect x="40" y="86" width="344" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="66" cy="112" r="13" fill="#16A34A"/><text x="66" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="90" y="110" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Wire crate with divider</text>
<text x="90" y="128" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Adjustable as the puppy grows — the one bed that lasts a lifetime</text>
<circle cx="66" cy="160" r="13" fill="#16A34A"/><text x="66" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="90" y="158" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Enzymatic cleaner</text>
<text x="90" y="176" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Breaks down odor markers regular cleaner leaves behind</text>
<circle cx="66" cy="208" r="13" fill="#16A34A"/><text x="66" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="90" y="206" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Chew toys: KONG + rope + rubber</text>
<text x="90" y="224" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Teething relief — or your baseboards become the chew toy</text>
<rect x="416" y="86" width="344" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<circle cx="442" cy="112" r="13" fill="#16A34A"/><text x="442" y="117" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="466" y="110" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">6-ft leash + flat collar + ID tag</text>
<text x="466" y="128" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">No retractable. Tag goes on before the puppy comes home</text>
<circle cx="442" cy="160" r="13" fill="#16A34A"/><text x="442" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="466" y="158" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Stainless steel bowls</text>
<text x="466" y="176" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Unbreakable, dishwasher-safe, no bacteria scratches</text>
<circle cx="442" cy="208" r="13" fill="#16A34A"/><text x="442" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">✓</text>
<text x="466" y="206" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Same puppy food as breeder/shelter</text>
<text x="466" y="224" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">No diet switch in week one — stress + new food = emergency</text>
<rect x="40" y="256" width="720" height="150" rx="12" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1.5"/>
<text x="64" y="284" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1F1F1F">And the puppy-proofing that matters:</text>
<text x="64" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">• Electrical cords taped / covered — a chewed live cord means mouth burns or worse</text>
<text x="64" y="332" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">• Toxic plants (lilies, sago palm, azaleas) moved up and out — check the ASPCA list</text>
<text x="64" y="356" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">• Trash cans behind a door or heavy lid — chicken bones are a vet visit waiting to happen</text>
<text x="64" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#333333">• Baby gates at the top AND bottom of stairs — puppies climb up before they can climb down</text>
<text x="64" y="398" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Rule of thumb: within 18 inches of the floor and you care about it — move it.</text>
</svg>