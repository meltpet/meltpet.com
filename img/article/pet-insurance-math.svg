<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect width="800" height="450" fill="#FAF6EF"/><rect x="0" y="0" width="800" height="58" fill="#F6851B"/><text x="28" y="26" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Pet Insurance: The Real Numbers</text><text x="28" y="46" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#FFF3E6">One $4,800 emergency surgery vs $4,200 of premiums over six years — the actual math</text><rect x="28" y="84" width="236" height="210" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="28" y="84" width="236" height="42" rx="10" fill="#DC2626"/><text x="146" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">THE EMERGENCY</text><text x="146" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#DC2626">$4,800</text><text x="146" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">surgery, paid upfront</text><text x="146" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">at 10 pm on a Saturday</text><text x="146" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">(this is why you need a plan)</text><text x="146" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">A sock. A $4,800 sock.</text><rect x="292" y="84" width="236" height="210" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="292" y="84" width="236" height="42" rx="10" fill="#2563EB"/><text x="410" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">INSURANCE PAID</text><text x="410" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#2563EB">$3,840</text><text x="410" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">80% after $500 deductible</text><text x="410" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">I paid: $500 + $960 = $1,460</text><text x="410" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Net insurance value this year:</text><text x="410" y="248" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#16A34A">+$2,380</text><rect x="556" y="84" width="216" height="210" rx="10" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/><rect x="556" y="84" width="216" height="42" rx="10" fill="#F6851B"/><text x="664" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">THE 6-YEAR VIEW</text><text x="664" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#D96F0E">$4,200</text><text x="664" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">total premiums, 6 years</text><text x="664" y="198" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">≈ $58/month average</text><text x="664" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#6B6B6B">Typical policy:</text><text x="664" y="248" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B6B6B">$250–500 ded · 80–90% pay</text><rect x="28" y="310" width="744" height="104" rx="10" fill="#FDE8D2"/><text x="48" y="336" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#D96F0E">Verdict: it’s a bet — and the odds depend on your dog</text><text x="48" y="360" font-family="Arial,Helvetica,sans-serif" font-size="12" 