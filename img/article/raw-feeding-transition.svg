<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF9F2"/><stop offset="1" stop-color="#FAF3E6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="48" fill="#F6851B"/>
  <text x="400" y="31" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">THE 7-DAY TRANSITION — SLOW WINS, EVERY TIME</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <!-- Card 1: x=52 w=156 center 130 -->
    <rect x="52" y="86" width="156" height="186" rx="14" fill="#FFFFFF" stroke="#F6851B" stroke-width="2"/>
    <circle cx="130" cy="122" r="20" fill="#F6851B"/>
    <text x="130" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">1–2</text>
    <text x="130" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#1F1F1F">Days 1–2</text>
    <rect x="64" y="174" width="132" height="24" rx="6" fill="#F6851B"/>
    <rect x="64" y="174" width="99" height="24" rx="6 0 0 6" fill="#EFB57C"/>
    <text x="130" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">75/25</text>
    <text x="130" y="226" text-anchor="middle" font-size="12" fill="#6B6B6B">old → raw</text>
    <text x="130" y="248" text-anchor="middle" font-size="11.5" fill="#8A8A8A">mix in the bowl</text>

    <!-- Card 2: x=232 center 310 -->
    <rect x="232" y="86" width="156" height="186" rx="14" fill="#FFFFFF" stroke="#F6851B" stroke-width="2"/>
    <circle cx="310" cy="122" r="20" fill="#F6851B"/>
    <text x="310" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">3–4</text>
    <text x="310" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#1F1F1F">Days 3–4</text>
    <rect x="244" y="174" width="132" height="24" rx="6" fill="#F6851B"/>
    <rect x="244" y="174" width="66" height="24" rx="6 0 0 6" fill="#EFB57C"/>
    <text x="310" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">50/50</text>
    <text x="310" y="226" text-anchor="middle" font-size="12" fill="#6B6B6B">stool smaller</text>
    <text x="310" y="248" text-anchor="middle" font-size="11.5" fill="#8A8A8A">and firmer here</text>

    <!-- Card 3: x=412 center 490 -->
    <rect x="412" y="86" width="156" height="186" rx="14" fill="#FFFFFF" stroke="#F6851B" stroke-width="2"/>
    <circle cx="490" cy="122" r="20" fill="#F6851B"/>
    <text x="490" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">5–6</text>
    <text x="490" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#1F1F1F">Days 5–6</text>
    <rect x="424" y="174" width="132" height="24" rx="6" fill="#F6851B"/>
    <rect x="424" y="174" width="33" height="24" rx="6 0 0 6" fill="#EFB57C"/>
    <text x="490" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">25/75</text>
    <text x="490" y="226" text-anchor="middle" font-size="12" fill="#6B6B6B">mostly raw now</text>
    <text x="490" y="248" text-anchor="middle" font-size="11.5" fill="#8A8A8A">watch stool daily</text>

    <!-- Card 4: x=592 center 670 -->
    <rect x="592" y="86" width="156" height="186" rx="14" fill="#FFF4E4" stroke="#F6851B" stroke-width="2.5"/>
    <circle cx="670" cy="122" r="20" fill="#C2410C"/>
    <text x="670" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">7</text>
    <text x="670" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#1F1F1F">Day 7</text>
    <rect x="604" y="174" width="132" height="24" rx="6" fill="#C2410C"/>
    <text x="670" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">100% raw</text>
    <text x="670" y="226" text-anchor="middle" font-size="12" fill="#6B6B6B">give it 2 weeks</text>
    <text x="670" y="248" text-anchor="middle" font-size="11.5" fill="#8A8A8A">before judging</text>

    <!-- Arrows between cards -->
    <text x="220" y="180" font-size="24" fill="#F6851B" text-anchor="middle">→</text>
    <text x="400" y="180" font-size="24" fill="#F6851B" text-anchor="middle">→</text>
    <text x="580" y="180" font-size="24" fill="#F6851B" text-anchor="middle">→</text>
  </g>

  <!-- Footer -->
  <rect x="52" y="300" width="696" height="122" rx="12" fill="#FFF7EC" stroke="#F6851B" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="700" fill="#C2410C">A little loose stool during transition is normal. Bloody stool, vomiting, or lethargy is not — stop and call your vet.</text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#6B6B6B">Liquid stool? Step back one stage for two days, then advance more slowly.</text>
  <text x="400" y="386" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#6B6B6B">Puppies and seniors: stretch the same steps over 10–14 days.</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#8A8A8A">Switching proteins later? Apply the same slow logic.</text>
</svg>
