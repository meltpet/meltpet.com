<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Scene: a cat sitting beside an unused litter box, looking at a puddle on the floor -->
  <!-- Wall -->
  <rect x="0" y="0" width="400" height="180" fill="#FBF3E6"/>
  <!-- Skirting line -->
  <line x1="0" y1="180" x2="400" y2="180" stroke="#E3D5BE" stroke-width="2"/>
  <!-- Floor -->
  <rect x="0" y="180" width="400" height="100" fill="#EFE1CB"/>

  <!-- Puddle (the accident) -->
  <ellipse cx="92" cy="228" rx="46" ry="12" fill="#BFD9E8" opacity="0.9"/>
  <ellipse cx="80" cy="225" rx="18" ry="5" fill="#D7E9F4" opacity="0.9"/>

  <!-- Litter box (clean, unused) -->
  <!-- back rim -->
  <rect x="262" y="138" width="112" height="76" rx="8" fill="#C7D3DB" stroke="#4A5A63" stroke-width="2.5"/>
  <!-- front opening / high sides -->
  <path d="M266 160 L266 210 Q266 214 270 214 L366 214 Q370 214 370 210 L370 160 Z" fill="#DCE6EC" stroke="#4A5A63" stroke-width="2.5"/>
  <!-- litter surface -->
  <rect x="272" y="168" width="92" height="22" rx="5" fill="#E9E1D2"/>
  <!-- litter granules -->
  <g fill="#CDC3AE">
    <circle cx="286" cy="179" r="2.2"/>
    <circle cx="300" cy="175" r="2"/>
    <circle cx="314" cy="182" r="2.3"/>
    <circle cx="328" cy="176" r="2.1"/>
    <circle cx="344" cy="181" r="2.2"/>
    <circle cx="352" cy="173" r="1.8"/>
  </g>
  <!-- tiny paw-print label on the box -->
  <g fill="#8FA5B0">
    <ellipse cx="318" cy="200" rx="5" ry="4"/>
    <circle cx="310" cy="195" r="1.9"/>
    <circle cx="315" cy="192" r="1.9"/>
    <circle cx="321" cy="192" r="1.9"/>
    <circle cx="326" cy="195" r="1.9"/>
  </g>

  <!-- Cat (sitting, facing left toward the puddle) -->
  <!-- tail, curling out to the right and resting on the floor -->
  <path d="M180 208 Q212 212 206 230 Q200 239 186 233" stroke="#5A4020" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 208 Q212 212 206 230 Q200 239 186 233" stroke="#E9C48A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M203 219 Q207 224 205 230" stroke="#C89840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- hind haunch -->
  <ellipse cx="146" cy="204" rx="27" ry="24" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
  <!-- body -->
  <ellipse cx="152" cy="180" rx="30" ry="38" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
  <!-- chest -->
  <ellipse cx="136" cy="188" rx="14" ry="22" fill="#F7E7C8" stroke="none"/>
  <!-- front legs -->
  <rect x="146" y="196" width="13" height="34" rx="6" fill="#EED4A0" stroke="#5A4020" stroke-width="2.5"/>
  <rect x="160" y="196" width="13" height="34" rx="6" fill="#EED4A0" stroke="#5A4020" stroke-width="2.5"/>
  <!-- paws -->
  <ellipse cx="152.5" cy="230" rx="8" ry="4" fill="#F7E7C8" stroke="#5A4020" stroke-width="2"/>
  <ellipse cx="166.5" cy="230" rx="8" ry="4" fill="#F7E7C8" stroke="#5A4020" stroke-width="2"/>
  <!-- stripes on body -->
  <g stroke="#C89840" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M160 162 Q170 168 168 178"/>
    <path d="M163 180 Q173 186 171 196"/>
  </g>

  <!-- head -->
  <circle cx="150" cy="131" r="27" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
  <!-- head stripes -->
  <g stroke="#C89840" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M143 108 L146 118"/>
    <path d="M152 106 L152 117"/>
    <path d="M161 108 L158 118"/>
  </g>
  <!-- ears -->
  <path d="M131 122 L122 94 L144 111" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M169 122 L178 94 L156 111" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M133 119 L127 101 L140 112" fill="#F2B8B0" stroke="none"/>
  <path d="M167 119 L173 101 L160 112" fill="#F2B8B0" stroke="none"/>
  <!-- eyes (looking left and down, toward the puddle) -->
  <ellipse cx="140" cy="130" rx="6.5" ry="7.5" fill="#FFFFFF" stroke="#5A4020" stroke-width="1.6"/>
  <ellipse cx="158" cy="130" rx="6.5" ry="7.5" fill="#FFFFFF" stroke="#5A4020" stroke-width="1.6"/>
  <circle cx="137.5" cy="132" r="3.6" fill="#4A6A2A"/>
  <circle cx="155.5" cy="132" r="3.6" fill="#4A6A2A"/>
  <ellipse cx="137.5" cy="132" rx="3.6" ry="1.3" fill="#1A1A1A"/>
  <ellipse cx="155.5" cy="132" rx="3.6" ry="1.3" fill="#1A1A1A"/>
  <circle cx="136" cy="130" r="1.3" fill="#FFFFFF"/>
  <circle cx="154" cy="130" r="1.3" fill="#FFFFFF"/>
  <!-- nose + mouth -->
  <path d="M147 141 L150 144 L153 141" fill="#F2A0A0" stroke="#F2A0A0" stroke-width="1"/>
  <path d="M146 145 Q150 148 150 144" stroke="#5A4020" stroke-width="1" fill="none"/>
  <path d="M150 144 Q150 148 154 145" stroke="#5A4020" stroke-width="1" fill="none"/>
  <!-- whiskers -->
  <g stroke="#C4B09A" stroke-width="1" stroke-linecap="round">
    <line x1="136" y1="140" x2="112" y2="136"/>
    <line x1="136" y1="144" x2="111" y2="146"/>
    <line x1="164" y1="140" x2="188" y2="136"/>
    <line x1="164" y1="144" x2="189" y2="146"/>
  </g>

  <!-- question mark -->
  <text x="196" y="106" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#F6851B">?</text>
</svg>
