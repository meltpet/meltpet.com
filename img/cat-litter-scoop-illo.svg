<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Scene: an open litter tray mid-scoop, a second tray behind it, and a cat arriving to inspect -->
  <!-- Wall -->
  <rect x="0" y="0" width="400" height="188" fill="#FBF3E6"/>
  <!-- Skirting line -->
  <line x1="0" y1="188" x2="400" y2="188" stroke="#E3D5BE" stroke-width="2"/>
  <!-- Floor -->
  <rect x="0" y="188" width="400" height="92" fill="#EFE1CB"/>

  <!-- Contact shadow under the front tray -->
  <ellipse cx="106" cy="242" rx="80" ry="9" fill="#E2D2B8"/>

  <!-- The tray: shadowed inner wall, the litter bed, then the near wall's lit inner face -->
  <rect x="34" y="190" width="142" height="50" rx="8" fill="#AFC0C8"/>
  <rect x="43" y="195" width="124" height="33" rx="2" fill="#E6D8C0"/>
  <!-- litter grain -->
  <g fill="#CFC1A9">
    <circle cx="56" cy="202" r="1.4"/><circle cx="70" cy="210" r="1.2"/><circle cx="84" cy="200" r="1.3"/>
    <circle cx="97" cy="214" r="1.2"/><circle cx="110" cy="204" r="1.4"/><circle cx="124" cy="212" r="1.2"/>
    <circle cx="137" cy="201" r="1.3"/><circle cx="150" cy="209" r="1.2"/><circle cx="62" cy="218" r="1.2"/>
    <circle cx="102" cy="220" r="1.3"/><circle cx="145" cy="220" r="1.2"/><circle cx="158" cy="216" r="1.3"/>
  </g>
  <!-- two clumps ready for the scoop -->
  <ellipse cx="88" cy="216" rx="9" ry="6" fill="#CBBBA2" stroke="#A8977F" stroke-width="1.2"/>
  <ellipse cx="118" cy="208" rx="6.5" ry="4.5" fill="#CBBBA2" stroke="#A8977F" stroke-width="1.2"/>
  <!-- the inner face of the near wall, lighter than the shadowed back wall -->
  <rect x="43" y="228" width="124" height="7" fill="#CBD8DE"/>
  <line x1="43" y1="228" x2="167" y2="228" stroke="#55676F" stroke-width="1.4" opacity="0.7"/>
  <!-- outer rim -->
  <rect x="34" y="190" width="142" height="50" rx="8" fill="none" stroke="#55676F" stroke-width="2.5"/>

  <!-- The scoop: slotted paddle resting in the litter, handle angled up and to the right -->
  <g>
    <path d="M134 200 L186 150" stroke="#6E8189" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M134 200 L186 150" stroke="#A8BCC4" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="104" y="200" width="34" height="20" rx="5" fill="#A8BCC4" stroke="#55676F" stroke-width="2" transform="rotate(-38 121 210)"/>
    <g stroke="#55676F" stroke-width="1.1" opacity="0.75" transform="rotate(-38 121 210)">
      <path d="M112 205 L112 215"/>
      <path d="M119 205 L119 215"/>
      <path d="M126 205 L126 215"/>
      <path d="M133 205 L133 215"/>
    </g>
  </g>

  <!-- A few grains tracked onto the floor beside the tray -->
  <g fill="#C7B8A2">
    <circle cx="186" cy="238" r="1.6"/><circle cx="194" cy="232" r="1.3"/>
    <circle cx="181" cy="246" r="1.3"/><circle cx="199" cy="243" r="1.4"/>
  </g>

  <!-- Contact shadow under the cat -->
  <ellipse cx="300" cy="239" rx="48" ry="8" fill="#E2D2B8"/>

  <!-- Cat, seated, facing the tray -->
  <g transform="translate(150,2)">
    <!-- tail curled round on the floor -->
    <path d="M180 206 Q214 210 208 229 Q202 239 187 232" stroke="#5A4020" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M180 206 Q214 210 208 229 Q202 239 187 232" stroke="#E9C48A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M204 218 Q208 223 206 229" stroke="#C89840" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- hind haunch -->
    <ellipse cx="146" cy="204" rx="27" ry="24" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
    <!-- body -->
    <ellipse cx="152" cy="180" rx="30" ry="38" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
    <!-- chest -->
    <ellipse cx="136" cy="188" rx="14" ry="22" fill="#F7E7C8" stroke="none"/>
    <!-- the near foreleg, weight-bearing -->
    <rect x="160" y="196" width="13" height="34" rx="6" fill="#EED4A0" stroke="#5A4020" stroke-width="2.5"/>
    <ellipse cx="166.5" cy="230" rx="8" ry="4" fill="#F7E7C8" stroke="#5A4020" stroke-width="2"/>
    <!-- the far foreleg, sitting slightly forward of the near one -->
    <rect x="144" y="200" width="12" height="31" rx="6" fill="#E3BE84" stroke="#5A4020" stroke-width="2.5"/>
    <ellipse cx="150" cy="231" rx="7.5" ry="3.8" fill="#EED4A0" stroke="#5A4020" stroke-width="2"/>
    <!-- body stripes -->
    <g stroke="#C89840" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M160 162 Q170 168 168 178"/>
      <path d="M163 180 Q173 186 171 196"/>
    </g>
    <!-- head -->
    <circle cx="150" cy="131" r="27" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5"/>
    <!-- head stripes -->
    <g stroke="#C89840" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M143 108 L146 118"/>
      <path d="M152 106 L152 117"/>
      <path d="M161 108 L158 118"/>
    </g>
    <!-- ears -->
    <path d="M131 122 L122 94 L144 111" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M169 122 L178 94 L156 111" fill="#E9C48A" stroke="#5A4020" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M133 119 L127 101 L140 112" fill="#F2B8B0" stroke="none"/>
    <path d="M167 119 L173 101 L160 112" fill="#F2B8B0" stroke="none"/>
    <!-- eyes, angled down-left toward the tray -->
    <ellipse cx="139" cy="130" rx="6.5" ry="7.5" fill="#FFFFFF" stroke="#5A4020" stroke-width="1.6"/>
    <ellipse cx="157" cy="130" rx="6.5" ry="7.5" fill="#FFFFFF" stroke="#5A4020" stroke-width="1.6"/>
    <circle cx="134" cy="131" r="3.6" fill="#4A6A2A"/>
    <circle cx="152" cy="131" r="3.6" fill="#4A6A2A"/>
    <ellipse cx="133.5" cy="131.5" rx="1.5" ry="3.4" fill="#1A1A1A"/>
    <ellipse cx="151.5" cy="131.5" rx="1.5" ry="3.4" fill="#1A1A1A"/>
    <circle cx="132" cy="129" r="1.3" fill="#FFFFFF"/>
    <circle cx="150" cy="129" r="1.3" fill="#FFFFFF"/>
    <!-- nose + mouth -->
    <path d="M147 141 L150 144 L153 141" fill="#F2A0A0" stroke="#F2A0A0" stroke-width="1"/>
    <path d="M146 145 Q150 148 150 144" stroke="#5A4020" stroke-width="1" fill="none"/>
    <path d="M150 144 Q150 148 154 145" stroke="#5A4020" stroke-width="1" fill="none"/>
    <!-- whiskers -->
    <g stroke="#C4B09A" stroke-width="1" stroke-linecap="round">
      <line x1="136" y1="140" x2="112" y2="137"/>
      <line x1="136" y1="144" x2="111" y2="147"/>
    </g>
  </g>
</svg>
