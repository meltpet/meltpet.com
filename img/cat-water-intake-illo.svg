<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Scene: an orange tabby lapping water, with a graduated jug showing the daily total -->
  <!-- Wall -->
  <rect x="0" y="0" width="400" height="182" fill="#e6eef7"/>
  <!-- Window -->
  <rect x="30" y="28" width="52" height="56" rx="4" fill="#cfe0f2" stroke="#b6cde6" stroke-width="1.6"/>
  <line x1="56" y1="28" x2="56" y2="84" stroke="#b6cde6" stroke-width="1.6"/>
  <line x1="30" y1="56" x2="82" y2="56" stroke="#b6cde6" stroke-width="1.6"/>
  <circle cx="70" cy="42" r="9" fill="#fde68a" opacity="0.85"/>
  <!-- Floor -->
  <rect x="0" y="182" width="400" height="98" fill="#dfe7f0"/>
  <ellipse cx="200" cy="232" rx="208" ry="48" fill="#d3dde9"/>

  <!-- Tail -->
  <path d="M70 198 Q46 192 44 166 Q43 148 58 144" stroke="#e0952f" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Back legs -->
  <rect x="86" y="216" width="19" height="28" rx="8" fill="#d98a26" stroke="#7a4a12" stroke-width="2.2"/>
  <rect x="108" y="218" width="19" height="26" rx="8" fill="#d98a26" stroke="#7a4a12" stroke-width="2.2"/>
  <!-- Body -->
  <ellipse cx="120" cy="192" rx="57" ry="34" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.5"/>
  <!-- Tabby stripes -->
  <g stroke="#c9801e" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M94 174 Q100 188 96 202"/>
    <path d="M112 170 Q118 185 114 200"/>
    <path d="M130 170 Q136 185 132 200"/>
  </g>
  <!-- Front legs -->
  <rect x="168" y="214" width="18" height="32" rx="8" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.2"/>
  <rect x="188" y="216" width="18" height="30" rx="8" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.2"/>
  <ellipse cx="177" cy="246" rx="11" ry="6" fill="#f7e2bd" stroke="#7a4a12" stroke-width="1.6"/>
  <ellipse cx="197" cy="246" rx="11" ry="6" fill="#f7e2bd" stroke="#7a4a12" stroke-width="1.6"/>

  <!-- Head -->
  <ellipse cx="176" cy="178" rx="28" ry="25" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.5"/>
  <!-- Ears -->
  <path d="M156 160 L146 132 L172 150 Z" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M172 148 L190 126 L196 154 Z" fill="#eaa63c" stroke="#7a4a12" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M158 156 L153 140 L168 151 Z" fill="#f0a8a0"/>
  <path d="M176 150 L187 137 L191 154 Z" fill="#f0a8a0"/>
  <!-- Eyes (closed, content) -->
  <path d="M164 176 Q169 181 174 176" stroke="#3a2010" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M181 175 Q186 180 191 175" stroke="#3a2010" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Muzzle and nose -->
  <ellipse cx="190" cy="190" rx="15" ry="10" fill="#f7e2bd"/>
  <path d="M184 183 L187 189 L181 189 Z" fill="#c96a5a"/>
  <!-- Tongue reaching the water -->
  <path d="M196 192 Q214 202 226 218 Q214 226 202 210 Z" fill="#ef8f9e" stroke="#d4707f" stroke-width="1.3"/>
  <!-- Whiskers -->
  <g stroke="#a8763a" stroke-width="1.2" stroke-linecap="round">
    <path d="M200 186 L218 182"/>
    <path d="M201 191 L220 193"/>
  </g>

  <!-- Water bowl -->
  <ellipse cx="248" cy="228" rx="46" ry="14" fill="#c3ccd6" stroke="#9aa7b4" stroke-width="2"/>
  <ellipse cx="248" cy="226" rx="46" ry="14" fill="#e8eef4" stroke="#9aa7b4" stroke-width="2"/>
  <ellipse cx="248" cy="229" rx="38" ry="10" fill="#a6d8f0"/>
  <ellipse cx="248" cy="228" rx="19" ry="5" fill="none" stroke="#7ab8dc" stroke-width="1.3"/>

  <!-- Graduated jug -->
  <path d="M320 150 L372 150 L367 232 L325 232 Z" fill="#f2f7fb" stroke="#9aa7b4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M322 166 L370 166 L366 232 L326 232 Z" fill="#8ec8e8"/>
  <rect x="320" y="146" width="52" height="7" rx="3.5" fill="#9aa7b4"/>
  <g stroke="#6f7d8c" stroke-width="1.3" stroke-linecap="round">
    <path d="M356 182 L368 182"/>
    <path d="M356 198 L368 198"/>
    <path d="M356 214 L368 214"/>
  </g>

  <!-- Droplet -->
  <path d="M300 116 q-9 13 0 19 q9 -6 0 -19 z" fill="#8ec8e8" stroke="#6aa8c8" stroke-width="1.4"/>
</svg>
