    <rect x="100" y="350" width="22" height="45" rx="10" fill="#B8733D"/>
    <rect x="155" y="355" width="22" height="40" rx="10" fill="#B8733D"/>
    <rect x="280" y="355" width="22" height="40" rx="10" fill="#B8733D"/>
    <rect x="340" y="350" width="22" height="45" rx="10" fill="#B8733D"/>
    <!-- Tail -->
    <path d="M400 310 Q430 290 435 310" stroke="#A0522D" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M52 232 Q60 238 68 232" stroke="#3D3D3D" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
