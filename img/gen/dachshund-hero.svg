<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle2"><circle cx="240" cy="240" r="220"/></clipPath>
  </defs>
  <g clip-path="url(#circle2)">
    <rect width="480" height="480" fill="#DFF0E0"/>
    <!-- Long body (signature dachshund trait - shown in profile) -->
    <ellipse cx="240" cy="330" rx="170" ry="55" fill="#A0522D"/>
    <!-- Chest -->
    <ellipse cx="140" cy="315" rx="45" ry="50" fill="#B8733D"/>
    <!-- Head - elongated -->
    <ellipse cx="105" cy="220" rx="48" ry="38" fill="#A0522D"/>
    <!-- Long snout -->
    <ellipse cx="70" cy="228" rx="30" ry="18" fill="#B8733D"/>
    <!-- Nose -->
    <ellipse cx="48" cy="225" rx="8" ry="6" fill="#1A1A1A"/>
    <!-- Eye -->
    <ellipse cx="105" cy="210" rx="10" ry="9" fill="#1A1A1A"/>
    <circle cx="103" cy="207" r="3" fill="#FFF" opacity="0.5"/>
    <!-- Long floppy ear -->
    <path d="M125 200 Q145 180 148 240 Q149 280 130 290 Q120 270 120 240 Z" fill="#6B3410"/>
    <!-- Neck -->
    <rect x="120" y="240" width="40" height="50" rx="15" fill="#A0522D"/>
