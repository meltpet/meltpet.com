<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF4"/>
      <stop offset="1" stop-color="#FBF2E4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#F6851B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F6851B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#B45309" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle paw prints -->
  <g fill="#F6851B" opacity="0.06">
    <circle cx="150" cy="560" r="10"/><circle cx="180" cy="548" r="7"/><circle cx="206" cy="556" r="7"/><circle cx="198" cy="580" r="7"/><circle cx="120" cy="548" r="7"/><ellipse cx="162" cy="588" rx="22" ry="14"/>
    <circle cx="1120" cy="90" r="8"/><circle cx="1142" cy="80" r="6"/><circle cx="1162" cy="88" r="6"/><circle cx="1156" cy="106" r="6"/><ellipse cx="1132" cy="112" rx="18" ry="11"/>
  </g>

  <!-- Left: brand + title -->
  <rect x="64" y="78" width="180" height="48" rx="24" fill="#F6851B"/>
  <text x="154" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">🐾 MeltPet</text>

  <text x="64" y="212" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="800" fill="#1F1F1F">Cat Food</text>
  <text x="64" y="290" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="800" fill="#F6851B">Carb</text>
  <text x="64" y="366" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="800" fill="#1F1F1F">Calculator</text>

  <text x="64" y="420" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#5D4E37">Reveal the carbs your label hides.</text>
  <text x="64" y="456" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#8A7A64">Dry-matter basis — compare wet vs dry fairly.</text>

  <rect x="64" y="494" width="196" height="46" rx="23" fill="#16A34A"/>
  <text x="162" y="524" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Free · No signup</text>

  <!-- Right: gauge card -->
  <rect x="556" y="84" width="580" height="470" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="846" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#DC2626">32% carbs</text>
  <text x="846" y="202" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#8A7A64">typical dry kibble · high for a cat</text>

  <!-- Gauge bar (0–50% carb scale) -->
  <g>
    <rect x="606" y="250" width="480" height="42" rx="21" fill="#EFEBE3"/>
    <rect x="606" y="250" width="96" height="42" rx="21" fill="#16A34A"/>
    <rect x="702" y="250" width="48" height="42" fill="#84CC16"/>
    <rect x="750" y="250" width="96" height="42" fill="#F59E0B"/>
    <rect x="846" y="250" width="240" height="42" rx="21" fill="#DC2626"/>
    <!-- marker at 32% -->
    <circle cx="913" cy="271" r="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="8"/>
  </g>

  <text x="606" y="330" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#16A34A" font-weight="700">0%</text>
  <text x="1086" y="330" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#DC2626" font-weight="700">50%</text>

  <g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#8A7A64">
    <text x="606" y="378"><tspan fill="#16A34A" font-weight="700">&lt; 10% low</tspan>   ·   10–15% moderate</text>
    <text x="606" y="404"><tspan fill="#F59E0B" font-weight="700">15–25% high</tspan>   ·   <tspan fill="#DC2626" font-weight="700">&gt; 25% very high</tspan></text>
  </g>

  <!-- Formula chip -->
  <rect x="606" y="430" width="480" height="76" rx="16" fill="#FAF8F4" stroke="#EFEBE3" stroke-width="2"/>
  <text x="630" y="464" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1F1F1F">Carbs = 100 − Protein − Fat − Fiber − Ash</text>
  <text x="630" y="494" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#8A7A64">all on a dry-matter basis</text>
</svg>