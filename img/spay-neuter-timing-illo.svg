<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- Scene: a wall calendar with one date circled, and a paw print on the shelf below -->
  <rect x="0" y="0" width="400" height="188" fill="#FBF3E6"/>
  <line x1="0" y1="188" x2="400" y2="188" stroke="#E3D5BE" stroke-width="2"/>
  <rect x="0" y="188" width="400" height="92" fill="#EFE1CB"/>

  <!-- Hanging rings -->
  <rect x="140" y="18" width="10" height="18" rx="5" fill="#CFBFA6"/>
  <rect x="250" y="18" width="10" height="18" rx="5" fill="#CFBFA6"/>

  <!-- Calendar page -->
  <rect x="92" y="24" width="216" height="156" rx="8" fill="#FFFDF7" stroke="#E3D5BE" stroke-width="2"/>

  <!-- Header band with rounded top corners -->
  <path d="M100 24 H300 A8 8 0 0 1 308 32 V56 H92 V32 A8 8 0 0 1 100 24 Z" fill="#E9C48A"/>
  <rect x="112" y="36" width="96" height="7" rx="3.5" fill="#FBF3E6"/>

  <!-- Date grid: 5 columns, 4 rows -->
  <g fill="#EFE1CB">
    <rect x="133" y="64"  width="22" height="22" rx="4"/>
    <rect x="161" y="64"  width="22" height="22" rx="4"/>
    <rect x="189" y="64"  width="22" height="22" rx="4"/>
    <rect x="217" y="64"  width="22" height="22" rx="4"/>
    <rect x="245" y="64"  width="22" height="22" rx="4"/>

    <rect x="133" y="92"  width="22" height="22" rx="4"/>
    <rect x="161" y="92"  width="22" height="22" rx="4"/>
    <rect x="217" y="92"  width="22" height="22" rx="4"/>
    <rect x="245" y="92"  width="22" height="22" rx="4"/>

    <rect x="133" y="120" width="22" height="22" rx="4"/>
    <rect x="161" y="120" width="22" height="22" rx="4"/>
    <rect x="189" y="120" width="22" height="22" rx="4"/>
    <rect x="217" y="120" width="22" height="22" rx="4"/>
    <rect x="245" y="120" width="22" height="22" rx="4"/>

    <rect x="133" y="148" width="22" height="22" rx="4"/>
    <rect x="161" y="148" width="22" height="22" rx="4"/>
    <rect x="189" y="148" width="22" height="22" rx="4"/>
    <rect x="217" y="148" width="22" height="22" rx="4"/>
    <rect x="245" y="148" width="22" height="22" rx="4"/>
  </g>

  <!-- The date in question -->
  <rect x="189" y="92" width="22" height="22" rx="4" fill="#F7D0A6"/>
  <circle cx="200" cy="103" r="16" stroke="#F6851B" stroke-width="3" fill="none"/>

  <!-- Paw print on the shelf -->
  <g fill="#C89840">
    <ellipse cx="318" cy="212" rx="10" ry="8.5"/>
    <ellipse cx="303" cy="198" rx="4.6" ry="5.6" transform="rotate(-18 303 198)"/>
    <ellipse cx="313" cy="193" rx="4.6" ry="5.6"/>
    <ellipse cx="324" cy="194" rx="4.6" ry="5.6" transform="rotate(12 324 194)"/>
    <ellipse cx="334" cy="201" rx="4.6" ry="5.6" transform="rotate(26 334 201)"/>
  </g>

  <!-- A short pencil resting on the shelf, left of the paw print -->
  <g transform="rotate(-8 84 226)">
    <rect x="34" y="218" width="96" height="14" rx="3" fill="#E9C48A" stroke="#C89840" stroke-width="1.6"/>
    <rect x="112" y="218" width="18" height="14" rx="2" fill="#FBF3E6" stroke="#C89840" stroke-width="1.6"/>
    <path d="M130 218 L142 225 L130 232 Z" fill="#5A4020"/>
  </g>
</svg>
